    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
      font-size: 20px;
    }
    input:focus {
      outline: none;
      border-bottom-color: #1c1b1b !important;
    }
    body {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-background text-on-background font-body-lg min-h-screen flex flex-col items-center">
<!-- Header: TopAppBar (Simulated from JSON Blueprint) -->
<header class="fixed top-0 left-0 w-full z-50 bg-background border-b border-outline-variant/20 flex justify-between items-center px-container-padding h-16">
<button class="hover:opacity-70 transition-opacity active:scale-95 duration-100 flex items-center justify-center">
<span class="material-symbols-outlined text-on-surface">arrow_back</span>
</button>
<div class="flex flex-col items-center">
<span class="font-eyebrow text-[9.5px] uppercase tracking-[0.2em] text-on-surface">PREFERENCES</span>
</div>
<button class="hover:opacity-70 transition-opacity active:scale-95 duration-100 flex items-center justify-center">
<span class="material-symbols-outlined text-on-surface">more_vert</span>
</button>
</header>
<!-- Content Canvas -->
<main class="w-full max-w-md pt-24 pb-32 px-container-padding flex flex-col space-y-section-gap">
<!-- Section 1: Personal Profile -->
<section class="flex flex-col space-y-6">
<div class="flex flex-col space-y-1">
<h2 class="font-eyebrow text-eyebrow uppercase text-outline">YOUR IDENTITY</h2>
</div>
<div class="space-y-8">
<div class="flex flex-col space-y-2">
<label class="font-eyebrow text-[10px] uppercase text-on-surface-variant">Full Name</label>
<input class="bg-transparent border-0 border-b border-outline-variant/30 py-2 px-0 font-body-lg text-on-background placeholder:text-outline-variant/60 focus:ring-0 w-full" placeholder="Enter legal name" type="text"/>
</div>
<div class="flex flex-col space-y-2">
<label class="font-eyebrow text-[10px] uppercase text-on-surface-variant">Current Employer</label>
<input class="bg-transparent border-0 border-b border-outline-variant/30 py-2 px-0 font-body-lg text-on-background placeholder:text-outline-variant/60 focus:ring-0 w-full" placeholder="Company name" type="text"/>
</div>
</div>
</section>
<!-- Section 2: Search Requirements -->
<section class="flex flex-col space-y-8">
<div class="flex flex-col space-y-1">
<h2 class="font-eyebrow text-eyebrow uppercase text-outline">SEARCH PARAMETERS</h2>
</div>
<div class="flex flex-col space-y-8">
<div class="flex flex-col space-y-2">
<label class="font-eyebrow text-[10px] uppercase text-on-surface-variant">Target Neighborhood</label>
<input class="bg-transparent border-0 border-b border-outline-variant/30 py-2 px-0 font-body-lg text-on-background placeholder:text-outline-variant/60 focus:ring-0 w-full" placeholder="e.g. Bandra West, Mumbai" type="text"/>
</div>
<div class="flex flex-col space-y-2">
<label class="font-eyebrow text-[10px] uppercase text-on-surface-variant">Monthly Budget</label>
<div class="flex items-baseline space-x-1 border-b border-outline-variant/30 pb-1">
<span class="font-metric-xl text-[32px] text-on-background leading-none">₹</span>
<input class="bg-transparent border-none p-0 font-metric-xl text-[32px] text-on-background focus:ring-0 w-full leading-none" type="text" value="45,000"/>
</div>
</div>
<div class="flex flex-col space-y-4">
<label class="font-eyebrow text-[10px] uppercase text-on-surface-variant">BHK Requirement</label>
<div class="flex space-x-3">
<button class="w-12 h-12 flex items-center justify-center border-[0.5px] border-outline-variant rounded-sm font-label-ui text-on-surface hover:bg-surface-container transition-colors">1</button>
<button class="w-12 h-12 flex items-center justify-center bg-on-background text-on-primary rounded-sm font-label-ui">2</button>
<button class="w-12 h-12 flex items-center justify-center border-[0.5px] border-outline-variant rounded-sm font-label-ui text-on-surface hover:bg-surface-container transition-colors">3</button>
<button class="w-12 h-12 flex items-center justify-center border-[0.5px] border-outline-variant rounded-sm font-label-ui text-on-surface hover:bg-surface-container transition-colors">4</button>
</div>
</div>
</div>
</section>
<!-- Section 3: Professional Verification -->
<section class="flex flex-col space-y-6">
<div class="flex flex-col space-y-1">
<h2 class="font-eyebrow text-eyebrow uppercase text-outline">JUDICIAL STANDING</h2>
</div>
<div class="space-y-px bg-outline-variant/10">
<div class="flex justify-between items-center py-4 bg-background border-b border-outline-variant/10">
<div class="flex items-center space-x-3">
<span class="material-symbols-outlined text-outline">link</span>
<span class="font-body-sm text-on-surface">LinkedIn Profile</span>
</div>
<span class="font-body-sm text-outline-variant">Pending</span>
</div>
<div class="flex justify-between items-center py-4 bg-background border-b border-outline-variant/10">
<div class="flex items-center space-x-3">
<span class="material-symbols-outlined text-outline">description</span>
<span class="font-body-sm text-on-surface">Salary Proof</span>
</div>
<span class="font-body-sm text-outline-variant">Pending</span>
</div>
</div>
</section>
<!-- Aesthetic Decorative Image (Editorial Feel) -->
<div class="w-full h-48 bg-surface-container overflow-hidden">
<img alt="Premium Office Space" class="w-full h-full object-cover grayscale opacity-60" data-alt="A high-end, minimalist architectural shot of a modern office lobby with clean concrete lines, warm wood accents, and soft, diffused natural lighting. The composition is strictly balanced with plenty of negative space, reflecting a quiet, professional judicial environment. The color palette is a sophisticated mix of warm grays, off-whites, and deep ink-colored shadows, evoking a sense of exclusive private banking." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBGxtSQBDSeDUul1oKirgiapHkivXWZaSLJ9wlLFLXOc-5K-IOg5ob3k0BoJjYS2Ti8UPLYZRN_q6OKWgUSlMO8kaDwAtL3psPew12IMeWBjpH4zs1n0-ZpUEaejvR3OJ5QQCneaqKdFTHstP91rSE0cNTSJy9E1x5fYDG_v4bkvtncMQFwk8PYMVLntBgAsr7aFs2e63U_4kzGs0LbuXrNCayzuVx86__-lzfptySYS18Sq-vwys7j-tYK0LPDZM42LOfxzL-PK39F"/>
</div>
</main>
<!-- Footer Actions -->
<footer class="fixed bottom-0 left-0 w-full bg-background/90 backdrop-blur-sm px-container-padding pb-8 pt-4">
<button class="w-full bg-on-background text-on-primary py-4 rounded-[2px] font-label-ui text-[11px] uppercase tracking-[0.15em] transition-transform active:scale-[0.98] duration-100">
      Save &amp; continue
    </button>
</footer>
</body></html>
