<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&amp;family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
        body {
            /* Overriding with the requested warm off-white specifically for the splash intent while keeping theme logic */
            background-color: #FAFAF7;
        }
        .tracking-ultra-wide {
            letter-spacing: 0.2em;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "on-error": "#ffffff",
                      "on-secondary": "#ffffff",
                      "inverse-primary": "#c6c6c7",
                      "primary": "#5d5f5f",
                      "secondary": "#5e5e5e",
                      "on-secondary-container": "#646464",
                      "on-primary-fixed": "#1a1c1c",
                      "inverse-on-surface": "#f4f0ef",
                      "surface-bright": "#fcf8f8",
                      "error-container": "#ffdad6",
                      "tertiary": "#5d5f5f",
                      "surface-tint": "#5d5f5f",
                      "primary-fixed": "#e2e2e2",
                      "error": "#ba1a1a",
                      "surface-variant": "#e5e2e1",
                      "surface-container-high": "#ebe7e7",
                      "outline": "#747878",
                      "on-secondary-fixed-variant": "#474747",
                      "on-primary-container": "#747676",
                      "on-error-container": "#93000a",
                      "tertiary-fixed-dim": "#c6c6c7",
                      "surface-dim": "#ddd9d9",
                      "on-tertiary-container": "#747676",
                      "surface-container-highest": "#e5e2e1",
                      "secondary-fixed-dim": "#c8c6c6",
                      "inverse-surface": "#313030",
                      "surface-container": "#f1edec",
                      "on-primary-fixed-variant": "#454747",
                      "surface-container-lowest": "#ffffff",
                      "primary-container": "#ffffff",
                      "on-surface-variant": "#444748",
                      "on-primary": "#ffffff",
                      "tertiary-fixed": "#e2e2e2",
                      "on-background": "#1c1b1b",
                      "on-tertiary-fixed-variant": "#454747",
                      "tertiary-container": "#ffffff",
                      "surface": "#fcf8f8",
                      "secondary-container": "#e4e2e2",
                      "on-tertiary": "#ffffff",
                      "secondary-fixed": "#e4e2e2",
                      "on-secondary-fixed": "#1b1c1c",
                      "surface-container-low": "#f6f3f2",
                      "on-surface": "#1c1b1b",
                      "background": "#fcf8f8",
                      "primary-fixed-dim": "#c6c6c7",
                      "on-tertiary": "#ffffff",
                      "outline-variant": "#c4c7c8"
              },
              "borderRadius": {
                      "DEFAULT": "0.125rem",
                      "lg": "0.25rem",
                      "xl": "0.5rem",
                      "full": "0.75rem"
              },
              "spacing": {
                      "unit": "8px",
                      "hairline": "0.5px",
                      "container-padding": "24px",
                      "section-gap": "48px",
                      "element-gap": "16px"
              },
              "fontFamily": {
                      "metric-md": ["Source Serif 4"],
                      "label-ui": ["Inter"],
                      "body-sm": ["Inter"],
                      "metric-xl": ["Source Serif 4"],
                      "eyebrow": ["Inter"],
                      "body-lg": ["Inter"]
              },
              "fontSize": {
                      "metric-md": ["24px", {"lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "400"}],
                      "label-ui": ["11px", {"lineHeight": "16px", "letterSpacing": "0.04em", "fontWeight": "500"}],
                      "body-sm": ["13px", {"lineHeight": "20px", "letterSpacing": "0", "fontWeight": "400"}],
                      "metric-xl": ["48px", {"lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "400"}],
                      "eyebrow": ["10px", {"lineHeight": "12px", "letterSpacing": "0.12em", "fontWeight": "500"}],
                      "body-lg": ["16px", {"lineHeight": "24px", "letterSpacing": "0", "fontWeight": "400"}]
              }
            },
          },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="antialiased overflow-hidden">
<!-- 
      SPLASH SCREEN CANVAS 
      Designed for architectural stillness and judicial clarity.
      Using the requested FAFAF7 warm surface background.
    -->
<main class="flex flex-col items-center justify-center min-h-screen w-full relative">
<!-- Center Wordmark Cluster -->
<div class="flex flex-col items-center space-y-4">
<!-- BRAND WORDMARK: RENTSHIELD -->
<!-- Using Sans-serif Inter via font-eyebrow, but custom sizing for splash dominance -->
<h1 class="font-eyebrow text-[32px] md:text-[40px] text-on-background tracking-[0.3em] uppercase font-bold" style="opacity: 0;">RENTSHIELD</h1>
<!-- TAGLINE -->
<!-- 10px warm gray serif text as requested -->
<p class="font-metric-md text-[12px] text-on-surface-variant tracking-[0.1em] uppercase">
                PREMIUM RENTAL PROTECTION
            </p>
</div>
<!-- SUBTLE ARCHITECTURAL ELEMENT -->
<!-- Vertical Hairline to ground the composition -->
<div class="absolute bottom-12 h-16 w-hairline bg-outline-variant opacity-30"></div>
</main>
<!-- 
      VISUAL METAPHOR (Background detail) 
      A very subtle textural reference to high-end paper or architectural blueprints.
    -->
<div class="fixed inset-0 pointer-events-none z-[-1] opacity-[0.02]">
<svg height="100%" width="100%" xmlns="http://www.w3.org/2000/svg">
<defs>
<pattern height="40" id="grid" patternUnits="userSpaceOnUse" width="40">
<path d="M 40 0 L 0 0 0 40" fill="none" stroke="currentColor" stroke-width="0.5"></path>
</pattern>
</defs>
<rect fill="url(#grid)" height="100%" width="100%"></rect>
</svg>
</div>


</body></html>
