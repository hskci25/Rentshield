<p class="font-body-lg text-body-lg text-on-surface-variant max-w-[280px]">Enter your mobile number to receive a secure access code.</p>
</section>

<div class="flex items-center gap-4 hairline-bottom pb-2 transition-all duration-300">
<span class="font-metric-md text-metric-md text-outline">+91</span>
<input class="w-full bg-transparent border-none p-0 focus:ring-0 font-metric-md text-metric-md text-on-surface placeholder:text-outline-variant" placeholder="00000 00000" type="tel"/>
</div>
</div>
</section>
<!-- Spacer for Layout Balance -->
<div class="flex-grow"></div>
<!-- Footer Actions & Judicial Policy -->
<footer class="flex flex-col gap-6 pb-12 mt-section-gap">
<button class="ink-button w-full h-14 font-label-ui text-label-ui uppercase tracking-widest flex items-center justify-center hover:opacity-90 active:scale-[0.98] transition-all">
                Get code
            </button>
<p class="font-body-sm text-body-sm text-outline text-center leading-relaxed">
                By continuing, you agree to our 
                <a class="underline decoration-outline/30 underline-offset-4 hover:text-on-surface transition-colors" href="#">judicial terms</a>

                <a class="underline decoration-outline/30 underline-offset-4 hover:text-on-surface transition-colors" href="#">privacy policy</a>.
