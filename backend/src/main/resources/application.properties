spring.application.name=backend
server.port=${PORT:8080}

# OTP config
otp.ttl-seconds=300
otp.max-attempts=5
otp.expose-otp-in-response=true
otp.provider=mock

# Google Play review (mock provider only): fixed OTP for a dedicated test number.
# Set via env OTP_PLAY_REVIEWER_MOBILE + OTP_PLAY_REVIEWER_OTP on the server (e.g. Render).
# Use a valid 10-digit Indian mobile ^[6-9]\\d{9}$ and a 6-digit code.
otp.play-reviewer-mobile=${OTP_PLAY_REVIEWER_MOBILE:}
otp.play-reviewer-otp=${OTP_PLAY_REVIEWER_OTP:}

# Twilio Verify config (required when otp.provider=twilio)
twilio.account-sid=${TWILIO_ACCOUNT_SID:}
twilio.auth-token=${TWILIO_AUTH_TOKEN:}
twilio.verify-service-sid=${TWILIO_VERIFY_SERVICE_SID:}
